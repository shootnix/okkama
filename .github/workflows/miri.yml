# The IR runtime's heap and cycle collector under Miri (#43): drops,
# reference counts and trial deletion without undefined behaviour.
#
# Miri interprets the code about a thousand times slower than it runs, so the
# tests take smaller sizes there (`scaled` in heap.rs, the collector's
# threshold in gc.rs). It runs when the runtime core changes, every night and
# by hand, not on every push.
name: Miri

on:
  push:
    branches: [develop]
    paths:
      - "okkama-rs/crates/okkama-runtime-core/**"
      - "okkama-rs/Cargo.lock"
      - ".github/workflows/miri.yml"
  pull_request:
    paths:
      - "okkama-rs/crates/okkama-runtime-core/**"
      - "okkama-rs/Cargo.lock"
      - ".github/workflows/miri.yml"
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: Miri (IR heap and cycle collector)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install nightly --profile minimal --component miri && cargo +nightly miri setup
      - name: Miri
        working-directory: okkama-rs
        run: "cargo +nightly miri test --locked -p okkama-runtime-core --lib -- gc:: heap::"
