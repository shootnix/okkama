# Тесты и conformance на каждый push в develop и в релизную ветку и на каждый
# pull request. Релизная ветка пушится после каждого влитого тикета: CI идёт
# параллельно работе, а не одним прогоном в конце релиза (#557).
name: CI

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # JDK 22+: тесты JVM-бэкенда и FFM natives (crypto, SQLite, терминал).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Dependencies only: workspace crates are rebuilt anyway, so a rerun of
      # a failed job starts from compiled dependencies (#557).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: okkama-rs -> target
          shared-key: tests-gate
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The gate profile: release optimisations without fat LTO. Linking each
      # of the ~90 test binaries with fat LTO took most of the job (#557); the
      # fat-LTO binaries are built and exercised by the conformance and std
      # jobs and by the packages workflow.
      - name: Build
        working-directory: okkama-rs
        run: cargo build --profile gate --locked -p okkama-cli -p okkama-native -p sparrow-cli -p blade-cli
      # Every test binary in parallel, all failures in one report, one retry
      # marked FLAKY (okkama-rs/.config/nextest.toml).
      - name: Test
        working-directory: okkama-rs
        run: cargo nextest run --cargo-profile gate --locked --workspace --profile ci
      - name: Doctests
        working-directory: okkama-rs
        run: cargo test --doc --profile gate --locked --workspace

  conformance:
    name: Conformance (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [sparrow, jvm]
    # SQLite 3.41+ (std db/sqlite): в Ubuntu 22.04 только 3.37.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # Адаптер собирает реализацию в свой каталог: кэшируем и его.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conformance/adapters/rust/.target
          key: ocs-${{ runner.os }}-${{ hashFiles('okkama-rs/Cargo.lock') }}
          restore-keys: ocs-${{ runner.os }}-
      # Адаптер собирает реализацию с --offline: crates заранее в реестре.
      - name: Fetch crates
        working-directory: okkama-rs
        run: cargo fetch --locked
      - name: Validate the suite
        working-directory: conformance
        run: ./ocs validate
      - name: Run full-release on ${{ matrix.engine }}
        working-directory: conformance
        run: |
          set +e
          ./ocs run --adapter adapters/rust/adapter.json --profile full-release \
            --adapter-env OCS_RUST_ENGINE=${{ matrix.engine }} -j 4 | tee ocs.log
          status=${PIPESTATUS[0]}
          # Каждый непройденный кейс — аннотация (видна в интерфейсе и в API).
          grep -E '^\[ *[0-9]+/ *[0-9]+\] +[A-Z_]+ ' ocs.log | grep -v '\] PASS ' | head -50 |
            while IFS= read -r line; do echo "::error title=OCS ${{ matrix.engine }}::$line"; done
          tail -1 ocs.log
          exit $status
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conformance-${{ matrix.engine }}
          path: conformance/reports/runs/
          if-no-files-found: ignore

  # The declared MSRV (workspace rust-version) builds every target (#41).
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' okkama-rs/Cargo.toml)"
          case "$msrv" in *.*.*) ;; *) msrv="$msrv.0" ;; esac
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
          rustc -V
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            okkama-rs/target
          key: msrv-${{ hashFiles('okkama-rs/Cargo.lock') }}
          restore-keys: msrv-
      - name: Check
        working-directory: okkama-rs
        run: cargo check --workspace --all-targets --locked

  # std inline tests on Sparrow, on x86_64 Linux:
  # the core's frame walk, stack maps and code memory there (#27).
  std:
    name: std tests (sparrow)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            okkama-rs/target
          key: std-${{ runner.os }}-${{ hashFiles('okkama-rs/Cargo.lock') }}
          restore-keys: std-${{ runner.os }}-
      - name: Build
        working-directory: okkama-rs
        run: cargo build --release --locked -p okkama-cli
      - name: std tests
        run: python3 tools/gate/std-tests.py
