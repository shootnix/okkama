# Пакеты Okkama: tar.gz для всех платформ, .pkg (macOS) и .deb (Linux).
#
# - push в develop: пакеты текущей версии `<версия>-nightly.<дата>.<sha>`,
#   пре-релиз `nightly` на странице Releases обновляется;
# - тег vX.Y.Z: релиз X.Y.Z (тег обязан совпадать с версией в Cargo.toml);
# - вручную (workflow_dispatch): только артефакты сборки.
#
# Публикация (релиз и nightly) ждёт ворота релиза (gate.yml) на том же
# коммите: провал ворот — ничего не публикуется.
name: Packages

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            smoke: true
          # Кросс-сборка на arm64-раннере: Intel-раннеры macOS уходят.
          # Смоук — под Rosetta 2 (ядро генерирует x86_64-код, #27).
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            smoke: true
            emulate: arch -x86_64
          # Built in manylinux2014 against glibc 2.17 (#485): the packages
          # install on every glibc distribution since 2014.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            smoke: true
            manylinux: quay.io/pypa/manylinux2014_x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The pinned release toolchain (tools/release-toolchain.txt, #41).
      - name: Rust
        run: |
          toolchain="$(cat tools/release-toolchain.txt)"
          rustup toolchain install "$toolchain" --profile minimal && rustup default "$toolchain"
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            okkama-rs/target
          key: packages-${{ matrix.target }}-${{ hashFiles('okkama-rs/Cargo.lock') }}
          restore-keys: packages-${{ matrix.target }}-
      - name: Version
        id: version
        run: |
          base="$(sed -n 's/^version = "\(.*\)"/\1/p' okkama-rs/Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$base" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $base in okkama-rs/Cargo.toml"
              exit 1
            fi
            echo "version=$base" >> "$GITHUB_OUTPUT"
          else
            echo "version=$base-nightly.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # The .rpm is built next to the .deb (#313).
      - name: RPM tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      # Linux binaries are compiled in manylinux2014 (glibc 2.17, #485) and
      # packaged on the runner, which has dpkg-deb and rpmbuild.
      - name: Build against glibc 2.17
        if: matrix.manylinux
        run: |
          docker run --rm -v "$PWD:/w" -w /w -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            ${{ matrix.manylinux }} bash -euc '
              curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal \
                --default-toolchain "$(cat tools/release-toolchain.txt)"
              . "$HOME/.cargo/env"
              cd okkama-rs
              cargo build --release --locked -p okkama-cli -p sparrow-cli -p blade-cli
              objdump -T target/release/okkama \
                | grep -o "GLIBC_[0-9.]*" | sort -t. -k2,2n -k3,3n -u | tail -n 1'
          sudo chown -R "$(id -u):$(id -g)" okkama-rs/target "$HOME/.cargo/registry"
      - name: Package
        run: >
          tools/package.sh
          ${{ matrix.manylinux && '--no-build' || format('--target {0}', matrix.target) }}
          --installer --version ${{ steps.version.outputs.version }} --out dist
      - name: Rosetta
        if: matrix.smoke && matrix.emulate
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Smoke test
        if: matrix.smoke
        run: |
          mkdir smoke
          tar -C smoke -xzf dist/okkama-*-${{ matrix.platform }}.tar.gz
          bin="$(echo smoke/okkama-*/bin)"
          run() { ${{ matrix.emulate }} "$@"; }
          run "$bin/okkama" env
          run "$bin/okkama" okkama-rs/examples/hello.ok
          run "$bin/okkama" run --engine sparrow okkama-rs/tools/pgo/workloads/02-calls/main.ok
          # The core's frame walk and stack maps under a stressed collector,
          # and budget polls in machine code.
          run env SPARROW_CORE_GC_STRESS=1 "$bin/okkama" run --engine sparrow okkama-rs/examples/hello.ok
          run "$bin/okkama" run --engine sparrow --max-steps 1000000000 okkama-rs/tools/pgo/workloads/02-calls/main.ok
          run "$bin/sparrow" --version
          run "$bin/blade" --version
      # Install the packages where v0.5.3's did not (glibc 2.26-2.34, #485)
      # and where they did, and run from /usr.
      - name: Install test
        if: runner.os == 'Linux'
        run: |
          check='okkama env >/dev/null
            okkama okkama-rs/examples/hello.ok
            okkama run --engine sparrow okkama-rs/tools/pgo/workloads/02-calls/main.ok
            sparrow --version
            blade --version'
          for image in rockylinux:8 rockylinux:9 amazonlinux:2 amazonlinux:2023 fedora:41; do
            echo "== $image"
            docker run --rm -v "$PWD:/w" -w /w "$image" bash -euc "
              rpm -i dist/okkama-*-${{ matrix.platform }}.rpm
              rpm -q okkama
              $check"
          done
          for image in debian:11 debian:12 ubuntu:20.04 ubuntu:24.04; do
            echo "== $image"
            docker run --rm -v "$PWD:/w" -w /w "$image" bash -euc "
              dpkg -i dist/okkama-*-${{ matrix.platform }}.deb
              dpkg -s okkama | grep -m1 Version
              $check"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: okkama-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # The full release gate on this commit: nothing is published without it.
  gate:
    uses: ./.github/workflows/gate.yml

  publish:
    name: Publish
    needs: [build, gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Only the packages: the gate uploads its report as an artifact too, and
      # `gh release create dist/*` cannot upload a directory.
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: okkama-*
          merge-multiple: true
      - name: Release ${{ github.ref_name }}
        if: github.ref_type == 'tag'
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --title "Okkama ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
      - name: Nightly
        if: github.ref == 'refs/heads/develop'
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "Nightly" \
            --notes "Built from develop at $GITHUB_SHA. Unstable: use a tagged release for anything real."
