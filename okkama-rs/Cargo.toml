[workspace]
resolver = "3"
members = ["crates/okkama-compiler", "crates/okkama-cli", "crates/okkama-native", "crates/okkama-runtime", "crates/okkama-sparrow", "crates/okkama-runtime-core", "crates/okkama-runtime-abi", "crates/sparrow-vm", "crates/sparrow-cli", "crates/blade", "crates/blade-cli"]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Межкрейтовое встраивание горячих путей (`Value`, `IntValue`, ops ядра в
# цикле VM и помощниках JIT); unwind остаётся — помощники JIT ловят панику.
[profile.release]
lto = "fat"
codegen-units = 1
