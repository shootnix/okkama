[workspace]
resolver = "3"
members = ["crates/okkama-compiler", "crates/okkama-cli", "crates/okkama-native", "crates/okkama-runtime", "crates/okkama-sparrow", "crates/okkama-runtime-core", "crates/okkama-runtime-abi", "crates/sparrow-cli", "crates/blade", "crates/blade-cli", "crates/sparrow-core", "crates/okkama-persistent"]

[workspace.package]
version = "0.5.8"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Межкрейтовое встраивание горячих путей (`Value`, `IntValue`, ops ядра в
# цикле VM и помощниках JIT); unwind остаётся — помощники JIT ловят панику.
[profile.release]
lto = "fat"
codegen-units = 1

# Release-тесты ворот (`cargo test --profile gate`): оптимизации release, но
# без fat LTO и с параллельной кодогенерацией. Каждый из ~90 тестовых
# бинарников иначе линкуется полной LTO (20 минут сборки на 30 секунд
# тестов). Бинарники с fat LTO собирает шаг build ворот, и их проверяют
# conformance, std и t/.
[profile.gate]
inherits = "release"
lto = "off"
codegen-units = 16
