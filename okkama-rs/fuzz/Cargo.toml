# Coverage-guided fuzzing (H-17, #34): `cargo +nightly fuzz run <target>`.
# Not a member of the okkama-rs workspace: nightly only, its own lockfile.
# CI: .github/workflows/fuzz.yml (nightly, keeps corpus, findings, coverage).
[package]
name = "okkama-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
okkama-compiler = { path = "../crates/okkama-compiler" }
okkama-sparrow = { path = "../crates/okkama-sparrow" }
sparrow-core = { path = "../crates/sparrow-core" }

[workspace]
members = ["."]

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analyze"
path = "fuzz_targets/analyze.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ir_verify"
path = "fuzz_targets/ir_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spb"
path = "fuzz_targets/spb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exec"
path = "fuzz_targets/exec.rs"
test = false
doc = false
bench = false
