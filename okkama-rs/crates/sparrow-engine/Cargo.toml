[package]
name = "sparrow-engine"
description = "New independent Sparrow execution core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sparrow-next"
path = "src/main.rs"

[dependencies]
okkama-sparrow = { path = "../okkama-sparrow" }
okkama-runtime-abi = { path = "../okkama-runtime-abi" }
okkama-native = { path = "../okkama-native" }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
num-bigint = "0.4"
num-traits = "0.2"
num-rational = "0.4.2"
num-integer = "0.1"
zeroize = "1.9.1"
miniz_oxide = "0.8"
unicode-normalization = "0.1"
dns-lookup = "2"
fancy-regex = "0.14"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "net", "sync", "io-util", "process"] }
nix = { version = "0.29", features = ["fs"] }
rustix = { version = "1", features = ["fs", "process"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
