[package]
name = "sparrow-proto"
description = "Architecture spike: whole-function JIT with direct calls and pointer objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sparrow-proto"
path = "src/main.rs"

[dependencies]
okkama-sparrow = { path = "../okkama-sparrow" }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"

[lints.rust]
missing_debug_implementations = "warn"
