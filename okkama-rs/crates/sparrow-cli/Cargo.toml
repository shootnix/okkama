[package]
name = "sparrow-cli"
description = "Sparrow command line: the core runtime (`sparrow`) and, for one release, the previous VM (`sparrow-origin`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
allocation-stats = ["dep:okkama-allocation-counter"]

[dependencies]
okkama-allocation-counter = { path = "../../tools/allocation-counter", optional = true }
okkama-sparrow = { path = "../okkama-sparrow" }
sparrow-vm = { path = "../sparrow-vm" }
sparrow-core = { path = "../sparrow-core", features = ["mimalloc"] }
mimalloc = { version = "0.1.52", default-features = false }

[lints]
workspace = true

[[bin]]
name = "sparrow"
path = "src/main.rs"

[[bin]]
name = "sparrow-origin"
path = "src/origin.rs"
