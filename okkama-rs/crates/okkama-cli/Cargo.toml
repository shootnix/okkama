[package]
name = "okkama-cli"
description = "Command-line front end for the Okkama compiler library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "okkama"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
okkama-compiler = { path = "../okkama-compiler" }
# Сервер языка (`okkama lsp`).
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.154"
okkama-runtime = { path = "../okkama-runtime" }
okkama-sparrow = { path = "../okkama-sparrow" }

[lints]
workspace = true
