# sparrow-core finds the roots of its collector by walking frame records from a
# runtime helper through machine code to the VM entry, so every Rust frame on
# that path must keep one. Apple targets always do; others omit frame pointers
# by default (a collection then follows a broken chain). tools/pgo/build.sh sets
# RUSTFLAGS, which replaces these flags, and passes the same one itself.
[target.'cfg(not(target_vendor = "apple"))']
rustflags = ["-C", "force-frame-pointers=yes"]
